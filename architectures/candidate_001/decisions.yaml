# Architectural Decisions: Candidate Architecture 001 (PEX)
# Note: These are design choices for the PEX candidate, NOT base requirements.

candidate:
  name: "PEX (Programmable Protocol Emulator eXecutive)"
  version: "0.2.0"
  target_role: "Candidate Architecture 001"

decisions:
  - id: ARCH-PEX-001
    title: "Quad Execution Lanes (SM0 to SM3)"
    decision: >
      Implement 4 independent single-cycle, non-pipelined execution lanes (SM0-SM3),
      each with its own 10-bit program counter (PC), 16-bit scratch registers (X, Y),
      16-bit shift registers (OSR, ISR), 3-bit side-set latch, and 16-bit stall counter.
    rationale: >
      Allows running multiple protocols concurrently (e.g. UART TX on SM0, UART RX on SM1,
      I2C on SM2, SPI on SM3) without complex preemptive multitasking or multi-threading logic.
    impacted_modules: ["execution_lane", "lane_scheduler"]
    satisfies_reqs: ["REQ-FUNC-008"]

  - id: ARCH-PEX-002
    title: "24-Bit Compact Microcoded Instruction Word Layout"
    decision: >
      Use a single uniform 24-bit instruction word containing five fields:
      DELAY[4:0] (bits 23:19, 0-31 cycle stall),
      SIDE[2:0] (bits 18:16, parallel side-set pin update),
      OPCODE[3:0] (bits 15:12, 12 active operations 0x0-0xB, 0xC-0xF reserved trap),
      PORT[3:0] (bits 11:8, operand source/dest selector),
      IMM[7:0] (bits 7:0, 8-bit immediate / address / mask).
    rationale: >
      Combines operation execution, pin manipulation, and timing delay into every single
      instruction, drastically reducing instruction count for bit-banging loops.
    impacted_modules: ["instruction_decode", "execution_lane"]
    satisfies_reqs: ["REQ-TIME-001", "REQ-FUNC-007"]

  - id: ARCH-PEX-003
    title: "16-to-24 Virtual Pin Crossbar Matrix with Identity Reset Default"
    decision: >
      Provide each lane with a 16-bit virtual pin bus (`VPINS[15:0]`). Each virtual pin
      is mapped via 4-bit config registers (`PINMAP0`, `PINMAP1`) to physical GPIOs 0-23,
      constant 0, constant 1, or internal flags. Defaults to identity mapping (VPINS[i]->GPIO[i])
      after reset.
    rationale: >
      Decouples firmware instruction encoding from physical pad assignments, enabling
      arbitrary routing, pin-swapping, and multi-lane pin sharing while providing immediate
      usability at power-on.
    impacted_modules: ["pin_crossbar", "gpio_mux"]
    satisfies_reqs: ["REQ-IF-001", "REQ-IF-003"]

  - id: ARCH-PEX-004
    title: "Dedicated Per-Lane 16-Bit × 8-Entry TX and RX FIFOs"
    decision: >
      Instantiate independent 8-entry deep, 16-bit wide TX and RX FIFOs for each of the
      4 execution lanes (total 64 × 16-bit registers = 1,024 flip-flops).
    rationale: >
      Decouples host streaming bandwidth from wire-level protocol timing while keeping
      flip-flop area within the 6,000 cell budget allocated for FIFOs.
    impacted_modules: ["fifo_block", "host_csr"]
    satisfies_reqs: ["REQ-FUNC-010"]

  - id: ARCH-PEX-005
    title: "Shared 1024 × 24-Bit Program SRAM with 256-Word Bank Partitioning"
    decision: >
      Implement a single 1024-word × 24-bit SRAM macro, logically partitioned into four
      256-word banks. Each lane's PC defaults to its own bank (`PC[9:8]` = lane index).
      Near jumps (`JMP` with condition) stay within the current bank; far jumps (`JMP`
      via `X[9:0]`) can reach anywhere in the 1024-word address space.
    rationale: >
      Fits within the single SRAM macro limit on Tiny Tapeout while providing each lane
      a dedicated 256-word program space and avoiding multi-lane SRAM read arbitration stalls.
    impacted_modules: ["program_sram", "sram_arbiter"]
    satisfies_reqs: ["REQ-PHYS-003", "REQ-FUNC-007"]

  - id: ARCH-PEX-006
    title: "Binary 10-Byte Packet Protocol for Post-Boot Host Link"
    decision: >
      Use a 10-byte binary packet structure (`0x5A | TYPE | ADDR[15:0] | DATA[31:0] | XSUM`)
      over the host UART for all post-boot CSR register access and FIFO streaming, with
      unsolicited EVENT packets suppressed when a response is pending.
    rationale: >
      Simple, lightweight, and robust framing that requires minimal logic cell area (< 1,500 cells)
      while supporting full-speed host read/write access and FIFO word streaming.
    impacted_modules: ["host_uart", "host_csr_fsm"]
    satisfies_reqs: ["REQ-IF-009"]

  - id: ARCH-PEX-007
    title: "Single-Cycle Non-Pipelined, Deterministic Execution Model"
    decision: >
      Each lane executes instructions in a single non-pipelined clock cycle: fetch, decode,
      register read, ALU/shift, pin update, and register write occur within one cycle of posedge clk.
      There are no caches, no branch prediction, and no speculative execution.
    rationale: >
      Eliminates all pipeline branch hazards, load-use bubbles, cache misses, and
      speculative mispredicts, guaranteeing deterministic integer cycle costs and
      bit-identical timing across sim, FPGA, and silicon (the architectural
      realisation of REQ-TIME-001).
    impacted_modules: ["execution_lane"]
    satisfies_reqs: ["REQ-TIME-001", "REQ-TIME-002"]

  - id: ARCH-PEX-008
    title: "5-Bit Per-Instruction DELAY Field"
    decision: >
      Every instruction carries a 5-bit `DELAY[4:0]` field (bits 23:19) in its instruction
      word that stalls lane advancement for 0 to 31 cycles after applying operation effects.
    rationale: >
      Enables fine-grained bit timing with zero additional program word overhead.
    impacted_modules: ["execution_lane", "timing_engine"]
    satisfies_reqs: ["REQ-TIME-004"]

  - id: ARCH-PEX-009
    title: "Extended DELAY Opcode Semantics (IMM / X)"
    decision: >
      Implement opcode 0x9 (`DELAY`) which stalls the lane for N+1 cycles, where N is
      selected by PORT from an 8-bit immediate (0-255) or the 16-bit X register (0-65535).
    rationale: >
      Enables coarse timing stalls up to 65,536 cycles in a single instruction word.
    impacted_modules: ["execution_lane", "timing_engine"]
    satisfies_reqs: ["REQ-TIME-005"]

  - id: ARCH-PEX-010
    title: "16-Bit CLKDIV Prescaler at CSR 0x20"
    decision: >
      A global 16-bit register `CLKDIV` at register address 0x20 divides the lane execution
      clock by (CLKDIV + 1), where 0 selects full-speed 50 MHz execution.
    rationale: >
      Provides simple hardware clock scaling for low-speed protocols without requiring PLLs.
    impacted_modules: ["clock_prescaler", "csr_block"]
    satisfies_reqs: ["REQ-IF-007"]

  - id: ARCH-PEX-011
    title: "Mask-ROM UART Bootstrap Loader with 0xAA Framing and Divisor 434"
    decision: >
      Implement a fixed ~64×24 mask-ROM bootloader listening on GPIO 0 (ui_in[0]) at 115200
      baud, 8-N-1 LSB-first, transmitting status and acknowledgements on GPIO 8 (uo_out[0]).
      Frames start with 0xAA sync, 16-bit LE length, 3-byte LE words, and 0x55 end marker.
      Writes words sequentially into SRAM from address 0.
    rationale: >
      Provides zero-transistor volatile memory bootloader without needing dedicated flash
      memory. GPIO 0 and GPIO 8 are chosen because only ui_in is input-only and only uo_out is
      output-only on the Tiny Tapeout harness, so a dedicated host link must occupy one of
      each; index 0 is the natural default.
    impacted_modules: ["bootstrap_rom", "host_uart"]
    satisfies_reqs: ["REQ-IF-008", "REQ-PERF-001"]

  - id: ARCH-PEX-012
    title: "32-Bit Granularity CSR Register Map (0x00 to 0xFF)"
    decision: >
      Memory-map all device control and status registers into a 256-byte space (64 × 32-bit words):
      global registers at 0x00-0x3F, per-lane registers at 0x40 + n*0x20 (0x40-0xBF), reserved 0xC0-0xFF.
      Accessed strictly with 32-bit word granularity; unused bits read as zero and ignore writes.
    rationale: >
      Standardizes host access and avoids misaligned byte-enable logic complexity.
    impacted_modules: ["csr_block"]
    satisfies_reqs: ["REQ-IF-009"]

  - id: ARCH-PEX-013
    title: "Buffer Watermark Thresholds (RXTHR/TXTHR) Driving FIFO_EV Flag"
    decision: >
      Per-lane `PCTRL` register carries 4-bit `RXTHR` [11:8] and 4-bit `TXTHR` [7:4] watermarks.
      When RX_LEVEL >= RXTHR (non-zero) or TX_LEVEL <= TXTHR (non-zero), a level-sensitive
      flag `FIFO_EV` is asserted in `PSTATUS[6]` and usable as a `WAIT` condition.
    rationale: >
      Allows lanes to wait on buffer levels without burning one of the 8 global IRQ lines.
    impacted_modules: ["fifo_block", "csr_block"]
    satisfies_reqs: ["REQ-FUNC-012"]

  - id: ARCH-PEX-014
    title: "Static Lane Priority Resolution for Output Contention"
    decision: >
      If multiple execution lanes map their virtual output pins to the same physical GPIO pin,
      contention is statically resolved by fixed priority: SM0 > SM1 > SM2 > SM3.
    rationale: >
      Guarantees deterministic electrical state in the event of software misconfiguration.
    impacted_modules: ["pin_crossbar"]
    satisfies_reqs: ["REQ-IF-003"]

  - id: ARCH-PEX-015
    title: "12-Opcode Microcode ISA Semantics and Reserved Opcode Trapping"
    decision: >
      The ISA implements 12 active opcodes (0x0 to 0xB: JMP, WAIT, IN, OUT, PUSH, PULL,
      MOV, IRQ, SET, DELAY, TS, HALT). Reserved opcodes 0xC-0xF trap the lane to IDLE
      without state corruption. IN/OUT support 1-16 bit shift counts (0 encodes 16) and
      assert shift-complete flag at zero.
    rationale: >
      Provides complete primitives for bit-banging, shift serialization, and event synchronization.
    impacted_modules: ["instruction_decode", "execution_lane"]
    satisfies_reqs: ["REQ-FUNC-001", "REQ-FUNC-002", "REQ-FUNC-003", "REQ-FUNC-005"]

  - id: ARCH-PEX-016
    title: "8-Line Latched-Flag IRQ System with Boundary Sampling"
    decision: >
      Implement exactly 8 global IRQ lines (IRQ0-IRQ7), each a single latched flag.
      Lanes manipulate lines via `IRQ` instruction (set, clear, wait). Host accesses
      via `IRQ_RAW`, `IRQ_EN`, `IRQ_CLR` CSRs. IRQ flags are sampled only at instruction
      boundaries and never pre-empt in-flight operations.
    rationale: >
      Provides cross-lane and host-lane synchronization without nondeterministic vector interrupts.
    impacted_modules: ["irq_controller", "csr_block"]
    satisfies_reqs: ["REQ-FUNC-009"]

  - id: ARCH-PEX-017
    title: "Per-Lane Execution State Machine (RESET, IDLE, RUN, STALL, PAUSED)"
    decision: >
      Each lane implements a 5-state FSM: RESET (entry), IDLE (boot done, waiting for GO),
      RUN (executing), STALL (waiting on condition or FIFO), and PAUSED (halted for debug).
      STALL freezes PC without duplicating instruction effects upon unblocking. PCTRL.RESET
      forces RESET within 1 cycle.
    rationale: >
      Provides clean lane lifecycle management, debug observability, and deterministic stalling.
    impacted_modules: ["lane_fsm", "csr_block"]
    satisfies_reqs: ["REQ-FUNC-011", "REQ-TIME-006"]

  - id: ARCH-PEX-018
    title: "Global Boot State Machine (RESET, BOOT, LOAD, READY, RUN)"
    decision: >
      Device bring-up is governed by a 5-state boot FSM: RESET (rst_n asserted), BOOT (sync wait),
      LOAD (streaming to SRAM), READY (valid 0x55 end marker received, lanes released to IDLE),
      and RUN (firmware active). Invalid frames return to BOOT.
    rationale: >
      Ensures orderly, safe power-up and firmware initialization over serial link.
    impacted_modules: ["boot_fsm"]
    satisfies_reqs: ["REQ-IF-008", "REQ-IF-010"]

  - id: ARCH-PEX-019
    title: "Per-Lane Scratch Registers (X, Y) and Debug CSR Access"
    decision: >
      Each lane contains 16-bit scratch registers X and Y used for delay counts, shift data,
      and far jumps. Accessible to host via per-lane `X_REG` and `Y_REG` CSRs when paused.
    rationale: >
      Supports iterative loop counting, dynamic delay programming, and non-intrusive host debug.
    impacted_modules: ["execution_lane", "csr_block"]
    satisfies_reqs: ["REQ-IF-009"]

  - id: ARCH-PEX-020
    title: "Per-Lane Output-Enable Mask in PCTRL"
    decision: >
      Each lane's `PCTRL` carries a 16-bit `OE_MASK` [27:12] controlling bidirectional
      pad driving for the pins it owns.
    rationale: >
      Enables dynamic open-drain emulation (I2C/1-Wire) by switching OE mask bits.
    impacted_modules: ["csr_block", "pin_crossbar"]
    satisfies_reqs: ["REQ-IF-002", "REQ-FUNC-006"]

  - id: ARCH-PEX-021
    title: "FIFO Stall Semantics on Empty PULL and Full PUSH"
    decision: >
      Executing `PULL` from an empty TX FIFO or `PUSH` to a full RX FIFO transitions the
      lane to STALL, freezing PC without corrupting FIFO contents or dropping words.
    rationale: >
      Guarantees lossless streaming flow control without software polling overhead.
    impacted_modules: ["fifo_block", "lane_fsm"]
    satisfies_reqs: ["REQ-FUNC-011"]

  - id: ARCH-PEX-022
    title: "FIFO Data Port (FIFO_DATA at +0x18) Push/Pop Semantics"
    decision: >
      Reading `FIFO_DATA` (+0x18) pops one 16-bit word from the lane's RX FIFO; writing
      pushes one 16-bit word into the lane's TX FIFO.
    rationale: >
      Provides single-register streaming interface for host data transfer.
    impacted_modules: ["fifo_block", "csr_block"]
    satisfies_reqs: ["REQ-FUNC-010", "REQ-IF-009"]

  - id: ARCH-PEX-023
    title: "Soft Reset and Per-Lane Reset CSR Semantics"
    decision: >
      Writing 1 to `CTRL.soft_reset` returns the device to BOOT without clearing SRAM.
      `PCTRL.RESET` resets to 1, cleared by bootloader on boot_done, writable by software.
    rationale: >
      Allows reloading firmware or restarting individual lanes without cycling physical power.
    impacted_modules: ["csr_block", "boot_fsm"]
    satisfies_reqs: ["REQ-IF-010"]

  - id: ARCH-PEX-024
    title: "Pre-P&R 75% Area Budget Gate"
    decision: >
      Synthesis must be run before place-and-route; mapped logic cell count must not
      exceed 75% of the total tile budget (<= 18,000 cells for 6x4 baseline) to reserve
      headroom for clock trees and routing.
    rationale: >
      Prevents costly layout failures and unroutable designs late in the design flow.
    impacted_modules: ["synthesis_flow"]
    satisfies_reqs: ["REQ-PHYS-002", "REQ-PHYS-006"]

  - id: ARCH-PEX-025
    title: "Absolute-Time Scheduling via TS Capture and WAIT against TS_REG"
    decision: >
      Opcode 0xA (`TS`) captures the 32-bit `TIMESTAMP` into `TS_REG` (split as `TS_HI`
      and `TS_LO`). `MOV` can preload arbitrary targets; `WAIT` with condition 0x5 blocks
      until `TIMESTAMP >= TS_REG`.
    rationale: >
      Enables cycle-accurate absolute scheduling and jitter-free periodic square waves.
    impacted_modules: ["timing_engine", "execution_lane"]
    satisfies_reqs: ["REQ-TIME-003", "REQ-TIME-006"]

  - id: ARCH-PEX-026
    title: "Boot Autostart via CTRL.autostart"
    decision: >
      Setting `CTRL.autostart` bit [0] causes the bootloader to automatically assert GO
      on lane 0 upon reaching the READY state.
    rationale: >
      Enables autonomous operation immediately after programming without host run commands.
    impacted_modules: ["boot_fsm", "csr_block"]
    satisfies_reqs: ["REQ-IF-008"]

  - id: ARCH-PEX-027
    title: "Host-Pin Ownership Handover After Boot"
    decision: >
      GPIO 0 and GPIO 8 are unconditionally owned by the host UART from reset until
      `boot_done`. Firmware may then claim them as protocol pins through the pin crossbar
      (`ARCH-PEX-003`), which suspends the register link for as long as the claim is held.
      A hardware reset always reclaims both pins for the bootloader.
    rationale: >
      With only 8 dedicated inputs and 8 dedicated outputs, a permanently reserved host
      link costs two pins that a pin-constrained protocol may need. Making the handover
      explicit and reset-revocable keeps the recovery path deterministic and prevents
      firmware from locking itself out of reflashing.
    impacted_modules: ["host_uart", "pin_crossbar", "boot_fsm"]
    satisfies_reqs: ["REQ-IF-011"]
